<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>German Preposition Exercise Generator</title>

<style>

body{
    font-family:Arial;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.section{
    margin-bottom:30px;
}

textarea{
    width:100%;
    height:250px;
    font-size:18px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

#output{
    min-height:250px;
    border:1px solid #ccc;
    padding:15px;
    white-space:pre-wrap;
    font-size:20px;
    line-height:2;
}

#status {
    margin-top: 10px;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
}

.blank {
    width: 60px;
    display: inline-block;
}

</style>
</head>

<body>

<h1>German Preposition Exercise Generator</h1>

<div class="section">

<h2>Input German Text</h2>

<textarea id="inputText"></textarea>

<br>

<button onclick="generateExercise()">
練習生成
</button>

</div>

<div class="section">

<h2>Exercise</h2>

<div id="status"></div>

<div id="output"></div>

</div>

<script>

async function generateExercise() {

    const text =
        document.getElementById("inputText").value;

    const status =
        document.getElementById("status");

    const output =
        document.getElementById("output");

    status.textContent =
        "🤖 GPT is generating your exercise...";

    output.innerHTML = "";

    try {

        const response = await fetch("/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: text
            })
        });

        const data = await response.json();

        // ✅ HERE is the correct place
        const answers = data.answers;

        output.innerHTML = renderExercise(data);

        status.textContent = "✅ Finished";

        // (optional) store globally for later checking
        window.currentAnswers = answers;

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Error while generating exercise.";
    }
}

function renderExercise(data) {

    let html = data.text;

    html = html.replace(/\[(\d+)\]/g, (match, id) => {
        return `<input class="blank" data-id="${id}">`;
    });

    return html;
}

</script>

</body>
</html>
