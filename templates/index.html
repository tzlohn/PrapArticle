<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>!!介系詞+冠詞練習機!!</title>

<style>

body{
    font-family:Arial;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.section{
    margin-bottom:30px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

#output{
    min-height:250px;
    border:1px solid #ccc;
    padding:15px;
    white-space:pre-wrap;
    font-size:20px;
    line-height:2;
}

#status {
    margin-top: 10px;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
}

.blank {
    width: 60px;
    display: inline-block;
    padding: 5px;
    font-size: 18px;
}

.blank.correct {
    background-color: lightblue;
    color: blue;
    border: 2px solid blue;
}

.blank.incorrect {
    background-color: lightcoral;
    color: red;
    border: 2px solid red;
}

.correction {
    color: red;
    font-weight: bold;
    margin-left: 5px;
}

</style>
</head>

<body>

<h1>German Preposition Exercise Generator</h1>

<div class="section">

<h2>Exercise</h2>

<div id="status"></div>

<div id="output"></div>

<button onclick="generateExercise()">Load New Exercise</button>

</div>

<script>

async function generateExercise() {

    const status =
        document.getElementById("status");

    const output =
        document.getElementById("output");

    status.textContent =
        "🤖 Generating a German exercise...";

    output.innerHTML = "";

    try {

        const response = await fetch("/generate", {
            method: "GET"
        });

        const data = await response.json();

        const answers = data.answers;

        // Store globally for answer checking
        window.currentAnswers = answers;

        renderExercise(data);

        status.textContent = "✅ Finished (press Enter after typing)";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Error while generating exercise.";
    }
}

function renderExercise(data) {

    let html = data.text;

    html = html.replace(/\[(\d+)\]/g, (match, id) => {
        return `<input class="blank" data-id="${id}">`;
    });

    const output = document.getElementById("output");
    output.innerHTML = html;

    // Add event listeners to all blank inputs
    const blanks = output.querySelectorAll(".blank");
    blanks.forEach(blank => {
        blank.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                checkAnswer(blank);
            }
        });
    });
}

function checkAnswer(inputElement) {
    const id = inputElement.getAttribute("data-id");
    const userAnswer = inputElement.value.trim();
    const correctAnswer = window.currentAnswers[id];

    if (!correctAnswer) {
        return;
    }

    // Case-insensitive comparison
    if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
        inputElement.classList.remove("incorrect");
        inputElement.classList.add("correct");
        inputElement.value = correctAnswer;
        inputElement.disabled = true;
    } else {
        inputElement.classList.remove("correct");
        inputElement.classList.add("incorrect");
        inputElement.value = correctAnswer;
        inputElement.disabled = true;
    }
}

// Auto-load exercise on page load
window.addEventListener("load", generateExercise);

</script>

</body>
</html>
