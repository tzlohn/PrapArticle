<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>!!介系詞+冠詞練習機!!</title>

<style>

body{
    font-family:Arial;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.section{
    margin-bottom:30px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
}

.controls label {
    font-size: 18px;
}

.controls select {
    font-size: 18px;
    padding: 6px 10px;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 18px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

#output{
    min-height:250px;
    border:1px solid #ccc;
    padding:15px;
    white-space:pre-wrap;
    font-size:20px;
    line-height:2;
}

#status {
    margin-top: 10px;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
}

.blank {
    width: 60px;
    display: inline-block;
    padding: 5px;
    font-size: 18px;
}

.blank.correct {
    background-color: lightblue;
    color: blue;
    border: 2px solid blue;
}

.blank.incorrect {
    background-color: lightcoral !important;
    color: red !important;
    border: 2px solid red !important;
}

.blank:disabled {
    cursor: default;
}

.correction {
    color: red;
    font-weight: bold;
    margin-left: 5px;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
    body {
        padding: 10px;
    }

    .controls {
        flex-direction: column;
        align-items: stretch;
    }

    h1 {
        font-size: 28px;
    }

    h2 {
        font-size: 22px;
    }

    button {
        font-size: 20px;
        padding: 12px 24px;
    }

    #output {
        font-size: 24px;
        padding: 20px;
    }

    #status {
        font-size: 20px;
    }

    .blank {
        width: 70px;
        font-size: 20px;
        padding: 8px;
    }
}

</style>
</head>

<body>

<h1>German Preposition Exercise Generator</h1>

<div class="section">

<h2>Exercise</h2>

<div class="controls">
    <label for="topic-select">文字情境</label>
    <select id="topic-select">
        <option value="office">office</option>
        <option value="shopping">shopping</option>
        <option value="restaurant">restaurant</option>
        <option value="family">family</option>
        <option value="Rathaus">Rathaus</option>
        <option value="travel">travel</option>
        <option value="school">school</option>
    </select>
    <label for="level-select">等級</label>
    <select id="level-select">
        <option value="A2">A2</option>
        <option value="B1" selected>B1</option>
        <option value="B2">B2</option>
        <option value="C1">C1</option>
    </select>
    <label class="checkbox-label"><input id="dialogue-mode" type="checkbox"> 對話模式</label>
    <button id="load-button" onclick="generateExercise()">Generate exercise</button>
    <button id="copy-button" onclick="copyFullText()">複製全文供其它工具作文法檢查</button>
</div>

<div id="status"></div>

<div id="output"></div>

</div>

<script>

async function generateExercise() {

    const status =
        document.getElementById("status");

    const output =
        document.getElementById("output");

    status.textContent =
        "🤖 Generating a German exercise...";

    output.innerHTML = "";

    try {

        const topic = document.getElementById("topic-select").value;
        const dialogue = document.getElementById("dialogue-mode").checked;
        const level = document.getElementById("level-select").value;

        const response = await fetch(
            `/generate?topic=${encodeURIComponent(topic)}&dialogue=${encodeURIComponent(dialogue)}&level=${encodeURIComponent(level)}`,
            { method: "GET" }
        );

        const data = await response.json();

        const answers = data.answers;

        // Store globally for answer checking
        window.currentAnswers = answers;

        renderExercise(data);

        status.textContent = "✅ Finished (press Enter or tap away after typing)";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Error while generating exercise.";
    }
}

function renderExercise(data) {

    let html = data.text;

    html = html.replace(/\[(\d+)\]/g, (match, id) => {
        return `<input class="blank" data-id="${id}">`;
    });

    const output = document.getElementById("output");
    output.innerHTML = html;

    // Add event listeners to all blank inputs
    const blanks = output.querySelectorAll(".blank");
    blanks.forEach(blank => {
        // Desktop: Enter key
        blank.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                checkAnswer(blank);
            }
        });
        // Mobile/Apple: blur event when user leaves the field
        blank.addEventListener("blur", (e) => {
            // Only check if not already checked (not disabled)
            if (!blank.disabled) {
                checkAnswer(blank);
            }
        });
    });
}

function checkAnswer(inputElement) {
    const id = inputElement.getAttribute("data-id");
    const userAnswer = inputElement.value.trim();
    const correctAnswer = window.currentAnswers[id];

    if (!correctAnswer) {
        return;
    }

    // Case-insensitive comparison
    if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
        inputElement.classList.remove("incorrect");
        inputElement.classList.add("correct");
        inputElement.value = correctAnswer;
        inputElement.disabled = true;
    } else {
        inputElement.classList.remove("correct");
        inputElement.classList.add("incorrect");
        inputElement.value = correctAnswer;
        inputElement.disabled = true;
    }
}

function copyFullText() {
    const output = document.getElementById('output');
    if (!output) return;

    // Clone output and replace input elements with their current values
    const clone = output.cloneNode(true);
    const inputs = clone.querySelectorAll('input.blank');
    inputs.forEach(i => {
        const span = document.createElement('span');
        span.textContent = i.value || '';
        i.parentNode.replaceChild(span, i);
    });

    // Use innerText to preserve visible line breaks
    const text = clone.innerText;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            const status = document.getElementById('status');
            if (status) status.textContent = '✅ Copied full text to clipboard';
        }).catch(err => {
            console.error('Copy failed', err);
        });
    } else {
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(textarea);
    }
}

// Auto-load is disabled so the user can choose a topic and options first

</script>

</body>
</html>
